[build]
publish = "dist"
command = "npm run build"

# Only redirect to index.html for paths that don't match actual files
[[redirects]]
from = "/*"
to = "/index.html"
status = 200

[[headers]]
for = "/assets/*"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/*"
[headers.values]
X-Frame-Options = "DENY"
X-XSS-Protection = "1; mode=block"

[dev]
command = "npm run dev"
port = 8888
targetPort = 5173