[build]
publish = "dist"
command = "npm run build"

# Force www
[[redirects]]
from = "https://afrinutsexport.com/*"
to = "https://www.afrinutsexport.com/:splat"
status = 301
force = true

# SPA fallback
[[redirects]]
from = "/*"
to = "/index.html"
status = 200

[[headers]]
for = "/assets/*"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[dev]
command = "npm run dev"
port = 8888
targetPort = 5173